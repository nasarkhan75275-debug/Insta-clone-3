<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL NASAR - Social Media App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <h1 class="logo">AL NASAR</h1>
        <div class="nav-icons">
            <i class="fa-solid fa-house"></i>
            <i class="fa-regular fa-paper-plane"></i>
            <i class="fa-regular fa-heart"></i>
        </div>
    </header>

    <div class="container">
        <div class="stories">
            <div class="story"><div class="story-img"><img src="https://i.pravatar.cc/100?img=1"></div><p>Your Story</p></div>
            <div class="story"><div class="story-img"><img src="https://i.pravatar.cc/100?img=2"></div><p>ali</p></div>
            <div class="story"><div class="story-img"><img src="https://i.pravatar.cc/100?img=3"></div><p>sara</p></div>
            <div class="story"><div class="story-img"><img src="https://i.pravatar.cc/100?img=4"></div><p>nasar</p></div>
        </div>

        <div class="post">
            <div class="post-header">
                <img src="https://i.pravatar.cc/100?img=5">
                <h4>AL NASAR Official</h4>
                <i class="fa-solid fa-ellipsis"></i>
            </div>
            <img class="post-img" src="https://picsum.photos/600/600?random=1">
            <div class="post-actions">
                <i class="fa-regular fa-heart like-btn"></i>
                <i class="fa-regular fa-comment"></i>
                <i class="fa-regular fa-paper-plane"></i>
                <i class="fa-regular fa-bookmark bookmark"></i>
            </div>
            <div class="caption"><b>AL NASAR</b> Welcome to AL NASAR - Social Media App ❤️ #AlNasar #Social</div>
        </div>

        <div class="post">
            <div class="post-header">
                <img src="https://i.pravatar.cc/100?img=8">
                <h4>nasar_khan</h4>
                <i class="fa-solid fa-ellipsis"></i>
            </div>
            <img class="post-img" src="https://picsum.photos/600/600?random=2">
            <div class="post-actions">
                <i class="fa-regular fa-heart like-btn"></i>
                <i class="fa-regular fa-comment"></i>
                <i class="fa-regular fa-paper-plane"></i>
                <i class="fa-regular fa-bookmark bookmark"></i>
            </div>
            <div class="caption"><b>nasar_khan</b> My first post on AL NASAR App 🔥</div>
        </div>
    </div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house"></i>
        <i class="fa-solid fa-magnifying-glass"></i>
        <i class="fa-regular fa-square-plus"></i>
        <i class="fa-solid fa-clapperboard"></i>
        <i class="fa-regular fa-user"></i>
    </nav>

<script src="script.js"></script>
</body>
  </html>
